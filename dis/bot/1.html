<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Discord Bot #1</title>
    <style>
        :root {
            --bg-main: #090d16; --bg-card: #111827; --text-main: #f3f4f6;
            --text-sec: #9ca3af; --accent-cyan: #22ffff; --accent-pink: #fe86a4; --border-color: #1f2937;
        }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; }
        .back-btn { color: var(--accent-cyan); text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        .box { background: var(--bg-card); border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; }
        h2 { color: var(--accent-cyan); margin-top: 0; }
        p { color: var(--text-sec); line-height: 1.5; }
        .status-badge { display: inline-block; background-color: #10b981; color: #090d16; font-weight: bold; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../botql.html" class="back-btn">&larr; Quay lại danh sách Bot</a>
        <div class="box">
            <span class="status-badge">🟢 Trạng thái: Online</span>
            <h2>🤖 Discord Bot #1 Management</h2>
            <p>Trang cấu hình chi tiết cho Bot số 1.</p>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
            <p><strong>Prefix lệnh:</strong> <code>!</code></p>
            <p><strong>Phiên bản:</strong> v1.0.4</p>
        </div>
    </div>
</body>
</html>
