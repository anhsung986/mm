<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Discord Bots (BotQL)</title>
    <style>
        :root {
            --bg-main: #090d16; --bg-card: #111827; --text-main: #f3f4f6;
            --text-sec: #9ca3af; --accent-cyan: #22ffff; --accent-pink: #fe86a4; --border-color: #1f2937;
        }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; }
        .back-btn { color: var(--accent-cyan); text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        h2 { color: var(--accent-cyan); margin-top: 0; }
        .bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 15px; margin-top: 20px; }
        .bot-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 18px; border-radius: 12px; text-decoration: none; color: var(--text-main); transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .bot-card:hover { border-color: var(--accent-cyan); transform: translateY(-3px); }
        .bot-card h3 { margin: 0 0 8px 0; color: var(--accent-pink); font-size: 1.1rem; }
        .bot-card p { margin: 0; font-size: 0.85rem; color: var(--text-sec); }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn">&larr; Quay lại trang chủ Hub</a>
        <h2>🤖 Bảng Điều Khiển Discord Bots (BotQL)</h2>
        <p style="color: var(--text-sec);">Chọn một bot bên dưới để xem cấu hình:</p>
        <div class="bot-grid">
            <a href="bot/1.html" class="bot-card">
                <div><h3>Bot #1</h3><p>Quản lý hệ thống âm nhạc & giải trí.</p></div>
                <span style="color: var(--accent-cyan); font-size: 0.8rem; margin-top: 12px; font-weight: bold;">Cấu hình &rarr;</span>
            </a>
            <a href="bot/2.html" class="bot-card">
                <div><h3>Bot #2</h3><p>Bot kiểm duyệt và bảo vệ server tự động.</p></div>
                <span style="color: var(--accent-cyan); font-size: 0.8rem; margin-top: 12px; font-weight: bold;">Cấu hình &rarr;</span>
            </a>
        </div>
    </div>
</body>
</html>
