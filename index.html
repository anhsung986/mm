<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project MM - Multi Camera</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

        /* Nút Chuyển Góc Nhìn */
        #btn-cam-view {
            position: absolute; top: 15px; right: 15px; z-index: 30;
            background: rgba(0, 0, 0, 0.6); color: #00ffcc; border: 1px solid #00ffcc;
            padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 13px;
        }
        #btn-cam-view:active { background: rgba(0, 255, 204, 0.4); }

        /* HUD Hotbar */
        #hud {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; background: rgba(0, 0, 0, 0.6); padding: 6px 12px;
            border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); z-index: 25;
        }
        .slot {
            width: 50px; height: 50px; border: 2px solid #555; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            color: #fff; font-size: 12px; background: rgba(255,255,255,0.1); text-align: center;
        }
        .slot.active { border-color: #00ffcc; background: rgba(0, 255, 204, 0.3); box-shadow: 0 0 8px #00ffcc; }

        /* Controls Mobile */
        .btn-touch {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.3);
            border: 2px solid #fff; color: white; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center; z-index: 20;
        }
        .btn-touch:active { background: rgba(0, 255, 204, 0.7); }

        #btn-jump { bottom: 90px; right: 20px; width: 60px; height: 60px; }
        #btn-action { bottom: 20px; right: 20px; width: 70px; height: 70px; background: rgba(0, 255, 150, 0.5); font-size: 14px; }
        #btn-break { bottom: 20px; right: 100px; width: 60px; height: 60px; background: rgba(255, 50, 50, 0.5); }

        /* Joystick */
        #joystick-zone {
            position: absolute; bottom: 20px; left: 20px; width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; z-index: 20;
        }
        #joystick-stick {
            position: absolute; top: 32px; left: 32px; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.6); border-radius: 50%; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="btn-cam-view" onclick="toggleCameraView()">GÓC NHÌN: 3RD</div>

    <div id="hud">
        <div class="slot active" id="slot-1" onclick="setSlot(1)">1: Khối Đất</div>
        <div class="slot" id="slot-2" onclick="setSlot(2)">2: Lò Xo</div>
        <div class="slot" id="slot-3" onclick="setSlot(3)">3: Súng</div>
    </div>

    <div id="joystick-zone"><div id="joystick-stick"></div></div>
    <div class="btn-touch" id="btn-jump">NHẢY</div>
    <div class="btn-touch" id="btn-action">ĐẶT</div>
    <div class="btn-touch" id="btn-break">PHÁ</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, playerGroup, playerBody;
        let blocks = [];
        let currentSlot = 1;
        let moveX = 0, moveZ = 0;
        let velY = 0, canJump = false;
        
        let pitch = 0, yaw = 0;
        
        // Chế độ Camera: 1 = Góc nhìn 1, 2 = Góc nhìn 2, 3 = Góc nhìn 3
        let cameraMode = 3; 

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x6eb5ff);

            // Group chứa Người chơi & Camera
            playerGroup = new THREE.Group();
            playerGroup.position.set(0, 2.5, 5);
            scene.add(playerGroup);

            // Mô hình Nhân vật 3D
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0xff3366 });
            playerBody = new THREE.Mesh(bodyGeo, bodyMat);
            playerBody.position.y = -0.9;
            playerGroup.add(playerBody);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            playerGroup.add(camera);

            updateCameraMode();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(20, 40, 20);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x666666));

            // Bản đồ Sàn cỏ
            const groundGeo = new THREE.BoxGeometry(1, 1, 1);
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x47a025 });
            for (let x = -12; x <= 12; x++) {
                for (let z = -12; z <= 12; z++) {
                    const cube = new THREE.Mesh(groundGeo, grassMat);
                    cube.position.set(x, 0, z);
                    scene.add(cube);
                    blocks.push(cube);
                }
            }

            setupControls();
            animate();
        }

        // Chuyển đổi giữa 3 Góc Nhìn
        function toggleCameraView() {
            cameraMode = (cameraMode % 3) + 1;
            updateCameraMode();
        }

        function updateCameraMode() {
            const btn = document.getElementById('btn-cam-view');
            if (cameraMode === 1) {
                // Góc nhìn thứ 1 (Mắt người chơi)
                camera.position.set(0, 0, 0);
                camera.rotation.y = 0;
                playerBody.visible = false; // Ẩn thân nhân vật để không vướng mắt
                btn.innerText = "GÓC NHÌN: 1ST";
            } else if (cameraMode === 2) {
                // Góc nhìn thứ 2 (Đối diện trước mặt)
                camera.position.set(0, 1, -4);
                camera.rotation.y = Math.PI; // Quay camera 180 độ nhìn vào mặt
                playerBody.visible = true;
                btn.innerText = "GÓC NHÌN: 2ND";
            } else if (cameraMode === 3) {
                // Góc nhìn thứ 3 (Sau lưng - Mặc định)
                camera.position.set(0, 1.5, 4);
                camera.rotation.y = 0;
                playerBody.visible = true;
                btn.innerText = "GÓC NHÌN: 3RD";
            }
        }

        function setSlot(num) {
            currentSlot = num;
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            document.getElementById(`slot-${num}`).classList.add('active');
            
            const btnAct = document.getElementById('btn-action');
            if (num === 1 || num === 2) btnAct.innerText = "ĐẶT";
            if (num === 3) btnAct.innerText = "BẮN";
        }

        function setupControls() {
            // Cảm ứng xoay Camera 4 hướng
            let touchStartX = 0, touchStartY = 0;
            document.addEventListener('touchstart', (e) => {
                for (let t of e.changedTouches) {
                    if (t.clientX > window.innerWidth / 2) {
                        touchStartX = t.clientX;
                        touchStartY = t.clientY;
                    }
                }
            });

            document.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) {
                    if (t.clientX > window.innerWidth / 2) {
                        let deltaX = t.clientX - touchStartX;
                        let deltaY = t.clientY - touchStartY;

                        yaw -= deltaX * 0.005;
                        pitch -= deltaY * 0.005;
                        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

                        playerGroup.rotation.y = yaw;
                        camera.rotation.x = pitch;

                        touchStartX = t.clientX;
                        touchStartY = t.clientY;
                    }
                }
            });

            // Joystick di chuyển
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            zone.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const rect = zone.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                let dist = Math.min(Math.sqrt(dx*dx + dy*dy), 35);
                let angle = Math.atan2(dy, dx);

                stick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                moveX = Math.cos(angle) * (dist / 35);
                moveZ = Math.sin(angle) * (dist / 35);
            });

            zone.addEventListener('touchend', () => {
                stick.style.transform = `translate(0px, 0px)`;
                moveX = 0; moveZ = 0;
            });

            // Phím tắt PC
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Digit4') toggleCameraView();
            });

            // Nút cảm ứng
            document.getElementById('btn-jump').addEventListener('touchstart', jump);
            document.getElementById('btn-action').addEventListener('touchstart', handlePrimaryAction);
            document.getElementById('btn-break').addEventListener('touchstart', breakBlock);
        }

        function jump() {
            if (canJump) { velY = 0.22; canJump = false; }
        }

        function handlePrimaryAction() {
            if (currentSlot === 1 || currentSlot === 2) placeBlock(currentSlot);
            if (currentSlot === 3) breakBlock();
        }

        function placeBlock(type) {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0 && intersects[0].distance < 10) {
                const intersect = intersects[0];
                const pos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));

                const geo = new THREE.BoxGeometry(1, 1, 1);
                let mat = (type === 1) 
                    ? new THREE.MeshLambertMaterial({ color: 0x8b5a2b }) 
                    : new THREE.MeshLambertMaterial({ color: 0xffcc00 });

                const block = new THREE.Mesh(geo, mat);
                block.position.set(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
                block.userData = { type: type };

                scene.add(block);
                blocks.push(block);
            }
        }

        function breakBlock() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0 && intersects[0].distance < 10) {
                const obj = intersects[0].object;
                if (obj.position.y !== 0) {
                    scene.remove(obj);
                    blocks = blocks.filter(b => b !== obj);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (moveX !== 0 || moveZ !== 0) {
                const dir = new THREE.Vector3(moveX, 0, moveZ);
                dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                playerGroup.translateX(dir.x * 0.12);
                playerGroup.translateZ(dir.z * 0.12);
            }

            playerGroup.position.y += velY;
            velY -= 0.01;
            if (playerGroup.position.y <= 2.5) {
                playerGroup.position.y = 2.5;
                velY = 0;
                canJump = true;
            }

            blocks.forEach(b => {
                if (b.userData && b.userData.type === 2) {
                    if (playerGroup.position.distanceTo(b.position) < 1.4 && playerGroup.position.y > b.position.y) {
                        velY = 0.42;
                    }
                }
            });

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
