<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project MM - Dual Play</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        /* HUD Thanh chọn vật phẩm */
        #hud {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(0, 0, 0, 0.6); padding: 8px 15px;
            border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); z-index: 25;
        }
        .slot {
            width: 55px; height: 55px; border: 2px solid #555; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            color: #fff; font-size: 13px; background: rgba(255,255,255,0.1); text-align: center;
        }
        .slot.active { border-color: #00ffcc; background: rgba(0, 255, 204, 0.3); box-shadow: 0 0 8px #00ffcc; }

        /* Nút cảm ứng cho Điện thoại */
        .btn-touch {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.25);
            border: 2px solid #fff; color: white; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center; z-index: 20;
        }
        .btn-touch:active { background: rgba(0, 255, 204, 0.6); }

        #btn-jump { bottom: 90px; right: 25px; width: 60px; height: 60px; }
        #btn-action { bottom: 25px; right: 25px; width: 75px; height: 75px; background: rgba(0, 255, 150, 0.4); font-size: 15px; }
        #btn-break { bottom: 25px; right: 110px; width: 60px; height: 60px; background: rgba(255, 50, 50, 0.4); }

        /* Joystick điều khiển */
        #joystick-zone {
            position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; z-index: 20;
        }
        #joystick-stick {
            position: absolute; top: 32px; left: 32px; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.6); border-radius: 50%; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <!-- UI Hotbar -->
    <div id="hud">
        <div class="slot active" id="slot-1" onclick="setSlot(1)">1: Khối Đất</div>
        <div class="slot" id="slot-2" onclick="setSlot(2)">2: Lò Xo</div>
        <div class="slot" id="slot-3" onclick="setSlot(3)">3: Súng</div>
    </div>

    <!-- Controls cho Mobile -->
    <div id="joystick-zone"><div id="joystick-stick"></div></div>
    <div class="btn-touch" id="btn-jump">NHẢY</div>
    <div class="btn-touch" id="btn-action">TÁC ĐỘNG</div>
    <div class="btn-touch" id="btn-break">PHÁ</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, gunMesh;
        let blocks = [];
        let currentSlot = 1;
        let moveX = 0, moveZ = 0;
        let velY = 0, canJump = false;

        // Bàn phím PC
        let moveFwd = false, moveBwd = false, moveLft = false, moveRgt = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x6eb5ff);
            scene.fog = new THREE.FogExp2(0x6eb5ff, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Ánh sáng
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);
            scene.add(new THREE.AmbientLight(0x666666));

            // Sàn Cỏ 3D
            const groundGeo = new THREE.BoxGeometry(1, 1, 1);
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x47a025 });
            for (let x = -12; x <= 12; x++) {
                for (let z = -12; z <= 12; z++) {
                    const cube = new THREE.Mesh(groundGeo, grassMat);
                    cube.position.set(x, 0, z);
                    cube.receiveShadow = true;
                    cube.castShadow = true;
                    scene.add(cube);
                    blocks.push(cube);
                }
            }

            // Mô hình Súng 3D gắn vào Camera
            createGunModel();

            setupControls();
            animate();
        }

        function createGunModel() {
            const gunGroup = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.15, 0.15, 0.6);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const gunBody = new THREE.Mesh(bodyGeo, bodyMat);
            gunGroup.add(gunBody);

            gunGroup.position.set(0.3, -0.25, -0.5);
            camera.add(gunGroup);
            scene.add(camera);
            gunMesh = gunGroup;
        }

        function setSlot(num) {
            currentSlot = num;
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            document.getElementById(`slot-${num}`).classList.add('active');
            
            const btnAct = document.getElementById('btn-action');
            if (num === 1 || num === 2) btnAct.innerText = "ĐẶT";
            if (num === 3) btnAct.innerText = "BẮN";
        }

        function setupControls() {
            // Cảm ứng Mobile xoay Camera
            let touchStartX = 0;
            document.addEventListener('touchstart', (e) => {
                for (let t of e.changedTouches) {
                    if (t.clientX > window.innerWidth / 2) touchStartX = t.clientX;
                }
            });
            document.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) {
                    if (t.clientX > window.innerWidth / 2) {
                        let deltaX = t.clientX - touchStartX;
                        camera.rotation.y -= deltaX * 0.004;
                        touchStartX = t.clientX;
                    }
                }
            });

            // Joystick di chuyển
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            zone.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const rect = zone.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                let dist = Math.min(Math.sqrt(dx*dx + dy*dy), 35);
                let angle = Math.atan2(dy, dx);

                stick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                moveX = Math.cos(angle) * (dist / 35);
                moveZ = Math.sin(angle) * (dist / 35);
            });

            zone.addEventListener('touchend', () => {
                stick.style.transform = `translate(0px, 0px)`;
                moveX = 0; moveZ = 0;
            });

            // Nút bấm Touch
            document.getElementById('btn-jump').addEventListener('touchstart', jump);
            document.getElementById('btn-action').addEventListener('touchstart', handlePrimaryAction);
            document.getElementById('btn-break').addEventListener('touchstart', breakBlock);

            // Điều khiển Bàn phím & Chuột PC
            document.addEventListener('click', (e) => {
                if (e.target.tagName !== 'DIV') document.body.requestPointerLock();
            });
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    camera.rotation.y -= e.movementX * 0.0025;
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveFwd = true;
                if (e.code === 'KeyS') moveBwd = true;
                if (e.code === 'KeyA') moveLft = true;
                if (e.code === 'KeyD') moveRgt = true;
                if (e.code === 'Space') jump();
                if (e.code === 'Digit1') setSlot(1);
                if (e.code === 'Digit2') setSlot(2);
                if (e.code === 'Digit3') setSlot(3);
            });
            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveFwd = false;
                if (e.code === 'KeyS') moveBwd = false;
                if (e.code === 'KeyA') moveLft = false;
                if (e.code === 'KeyD') moveRgt = false;
            });
            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement === document.body) {
                    if (e.button === 0) handlePrimaryAction();
                    if (e.button === 2) breakBlock();
                }
            });
        }

        function jump() {
            if (canJump) { velY = 0.22; canJump = false; }
        }

        function handlePrimaryAction() {
            if (currentSlot === 1 || currentSlot === 2) placeBlock(currentSlot);
            if (currentSlot === 3) shoot();
        }

        function placeBlock(type) {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0 && intersects[0].distance < 8) {
                const intersect = intersects[0];
                const pos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));
                
                const geo = new THREE.BoxGeometry(1, 1, 1);
                let mat = (type === 1) 
                    ? new THREE.MeshLambertMaterial({ color: 0x8b5a2b }) 
                    : new THREE.MeshLambertMaterial({ color: 0xffcc00, emissive: 0x332200 });

                const block = new THREE.Mesh(geo, mat);
                block.position.set(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
                block.castShadow = true;
                block.receiveShadow = true;
                block.userData = { type: type };

                scene.add(block);
                blocks.push(block);
            }
        }

        function breakBlock() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0 && intersects[0].distance < 8) {
                const obj = intersects[0].object;
                if (obj.position.y !== 0) {
                    scene.remove(obj);
                    blocks = blocks.filter(b => b !== obj);
                }
            }
        }

        function shoot() {
            if (gunMesh) {
                gunMesh.position.z = -0.3;
                setTimeout(() => gunMesh.position.z = -0.5, 100);
            }

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj.position.y !== 0) {
                    scene.remove(obj);
                    blocks = blocks.filter(b => b !== obj);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Di chuyển Joystick (Mobile)
            if (moveX !== 0 || moveZ !== 0) {
                camera.translateX(moveX * 0.12);
                camera.translateZ(moveZ * 0.12);
            }

            // Di chuyển Bàn phím (PC)
            const speed = 0.12;
            if (moveFwd) camera.translateZ(-speed);
            if (moveBwd) camera.translateZ(speed);
            if (moveLft) camera.translateX(-speed);
            if (moveRgt) camera.translateX(speed);

            // Trọng lực & Nhảy
            camera.position.y += velY;
            velY -= 0.01;
            if (camera.position.y <= 2.5) {
                camera.position.y = 2.5;
                velY = 0;
                canJump = true;
            }

            // Khối Lò xo nẩy
            blocks.forEach(b => {
                if (b.userData && b.userData.type === 2) {
                    if (camera.position.distanceTo(b.position) < 1.5 && camera.position.y > b.position.y) {
                        velY = 0.45;
                    }
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
