<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Minecraft Server</title>
    <style>
        :root {
            --bg-main: #090d16; --bg-card: #111827; --text-main: #f3f4f6;
            --text-sec: #9ca3af; --accent-cyan: #22ffff; --accent-pink: #fe86a4; --border-color: #1f2937;
        }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; }
        .back-btn { color: var(--accent-cyan); text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        .box { background: var(--bg-card); border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; }
        h2 { color: var(--accent-cyan); margin-top: 0; }
        .nav-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .nav-card { background: var(--bg-main); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; text-decoration: none; color: var(--text-main); transition: 0.2s; display: block; }
        .nav-card:hover { border-color: var(--accent-cyan); transform: translateY(-2px); }
        .nav-card h4 { margin: 0 0 5px 0; color: var(--accent-pink); }
        .nav-card p { margin: 0; font-size: 0.85rem; color: var(--text-sec); }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn">&larr; Quay lại trang chủ Hub</a>
        <div class="box">
            <h2>⛏️ Trung Tâm Điều Hành Minecraft Server</h2>
            <p style="color: var(--text-sec);">Trang tổng quan máy chủ phiên bản 1.21.4 (vietmc.mcsh.io). Chọn một phân khu chức năng bên dưới:</p>
            <div class="nav-links">
                <a href="qlsv.html" class="nav-card">
                    <h4>⚡ Console & Files</h4>
                    <p>Gửi lệnh trực tiếp và quản lý tệp cấu hình.</p>
                </a>
                <a href="plugins.html" class="nav-card">
                    <h4>🧩 Quản Lý Plugin</h4>
                    <p>Kiểm tra FAWE, WorldGuard, BlueMap...</p>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
